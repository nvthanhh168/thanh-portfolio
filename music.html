<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Nghe Nhạc | Nguyễn Viết Thành</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=Fira+Code:wght@400;500&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .text-gradient { background: linear-gradient(135deg, #10b981, #0ea5e9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .glass-card { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .glass-card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px -10px rgba(16, 185, 129, 0.3); border-color: rgba(16, 185, 129, 0.2); }
        .font-terminal { font-family: 'Fira Code', monospace; }

        /* Equalizer Bars */
        .eq-bar { width: 4px; background: linear-gradient(to top, #10b981, #0ea5e9); border-radius: 2px; animation: eq-idle 1.5s ease-in-out infinite; }
        .eq-playing .eq-bar { animation-name: eq-bounce; }
        .eq-bar:nth-child(1) { animation-delay: 0s; }
        .eq-bar:nth-child(2) { animation-delay: 0.15s; }
        .eq-bar:nth-child(3) { animation-delay: 0.3s; }
        .eq-bar:nth-child(4) { animation-delay: 0.1s; }
        .eq-bar:nth-child(5) { animation-delay: 0.25s; }
        .eq-bar:nth-child(6) { animation-delay: 0.05s; }
        .eq-bar:nth-child(7) { animation-delay: 0.2s; }
        .eq-bar:nth-child(8) { animation-delay: 0.35s; }
        .eq-bar:nth-child(9) { animation-delay: 0.12s; }
        .eq-bar:nth-child(10) { animation-delay: 0.28s; }
        .eq-bar:nth-child(11) { animation-delay: 0.08s; }
        .eq-bar:nth-child(12) { animation-delay: 0.22s; }
        .eq-bar:nth-child(13) { animation-delay: 0.18s; }
        .eq-bar:nth-child(14) { animation-delay: 0.32s; }
        .eq-bar:nth-child(15) { animation-delay: 0.02s; }
        .eq-bar:nth-child(16) { animation-delay: 0.27s; }

        @keyframes eq-idle {
            0%, 100% { height: 4px; }
            50% { height: 8px; }
        }
        @keyframes eq-bounce {
            0% { height: 4px; }
            25% { height: 28px; }
            50% { height: 12px; }
            75% { height: 22px; }
            100% { height: 4px; }
        }

        /* Progress bar */
        .progress-container { cursor: pointer; }
        .progress-bar { transition: width 0.1s linear; }
        .volume-slider { -webkit-appearance: none; appearance: none; height: 4px; background: #334155; border-radius: 2px; outline: none; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #10b981; cursor: pointer; }

        /* Song card active state */
        .song-card.active { border-color: rgba(16, 185, 129, 0.5); box-shadow: 0 0 20px rgba(16, 185, 129, 0.15); }
        .song-card.active .song-index { display: none; }
        .song-card.active .song-playing-icon { display: flex; }
    </style>
</head>
<body class="antialiased selection:bg-emerald-500 selection:text-white">

    <!-- Navigation -->
    <nav class="fixed w-full z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <a href="index.html" class="text-lg font-bold text-slate-300 hover:text-white transition flex items-center gap-2">
                    <i class="fas fa-arrow-left"></i> Về trang chủ
                </a>
                <div class="hidden sm:flex items-center gap-2 pl-4 border-l border-slate-700">
                    <a href="storage.html" class="text-xs text-violet-400 hover:text-white font-medium px-3 py-1 rounded-full bg-violet-500/10 border border-violet-500/20"><i class="fas fa-folder mr-1"></i> Kho Lưu Trữ</a>
                    <a href="blog.html" class="text-xs text-sky-400 hover:text-white font-medium px-3 py-1 rounded-full bg-sky-500/10 border border-sky-500/20"><i class="fas fa-book-open mr-1"></i> Tài liệu</a>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-1 eq-container" id="navEq">
                    <div class="eq-bar" style="height:4px"></div>
                    <div class="eq-bar" style="height:4px"></div>
                    <div class="eq-bar" style="height:4px"></div>
                    <div class="eq-bar" style="height:4px"></div>
                    <div class="eq-bar" style="height:4px"></div>
                </div>
                <span class="text-emerald-400 font-bold text-lg">🎵 NVThanh Music</span>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <section class="pt-32 pb-10 px-6 relative overflow-hidden">
        <div class="absolute top-0 left-1/3 w-96 h-96 bg-emerald-600/15 rounded-full blur-3xl"></div>
        <div class="absolute top-0 right-1/3 w-96 h-96 bg-sky-600/15 rounded-full blur-3xl"></div>
        <div class="max-w-4xl mx-auto text-center z-10 relative">
            <h1 class="text-4xl md:text-6xl font-bold mb-4">Nghe Nhạc <span class="text-gradient">Trực Tuyến</span></h1>
            <p class="text-slate-400 text-lg">Thư giãn với những bản nhạc yêu thích. Hoàn toàn miễn phí! 🎧</p>
        </div>
    </section>

    <!-- Main Player -->
    <section class="px-6 pb-8">
        <div class="max-w-4xl mx-auto">
            <div class="glass-card rounded-3xl p-6 md:p-8" style="transform:none;">
                <div class="grid grid-cols-1 md:grid-cols-[280px_1fr] gap-6 md:gap-8">
                    <!-- Album Art -->
                    <div class="relative mx-auto md:mx-0">
                        <div id="albumArt" class="w-64 h-64 md:w-[280px] md:h-[280px] rounded-2xl bg-gradient-to-br from-emerald-600 via-sky-600 to-indigo-600 flex items-center justify-center shadow-2xl shadow-emerald-500/20 overflow-hidden">
                            <i class="fas fa-music text-6xl text-white/30" id="albumIcon"></i>
                            <img id="albumImg" src="" alt="" class="absolute inset-0 w-full h-full object-cover rounded-2xl hidden">
                        </div>
                        <!-- Equalizer -->
                        <div class="flex items-end justify-center gap-[3px] h-10 mt-4 eq-container" id="mainEq">
                            <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
                            <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
                            <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
                            <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
                            <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
                            <div class="eq-bar"></div>
                        </div>
                    </div>
                    <!-- Controls -->
                    <div class="flex flex-col justify-between min-w-0">
                        <div>
                            <p class="text-xs text-emerald-400 font-terminal mb-2 uppercase tracking-widest">Đang phát</p>
                            <h2 id="songTitle" class="text-2xl md:text-3xl font-bold text-white mb-1 truncate">Chọn bài hát...</h2>
                            <p id="songArtist" class="text-lg text-slate-400 mb-6 truncate">---</p>
                        </div>
                        <!-- Progress -->
                        <div class="mb-4">
                            <div class="progress-container w-full h-2 bg-slate-700 rounded-full overflow-hidden" id="progressContainer">
                                <div class="progress-bar h-full bg-gradient-to-r from-emerald-500 to-sky-500 rounded-full" id="progressBar" style="width:0%"></div>
                            </div>
                            <div class="flex justify-between text-xs text-slate-500 font-terminal mt-2">
                                <span id="currentTime">0:00</span>
                                <span id="totalTime">0:00</span>
                            </div>
                        </div>
                        <!-- Buttons -->
                        <div class="flex items-center justify-center gap-4 md:gap-6 mb-4">
                            <button id="shuffleBtn" class="text-slate-500 hover:text-emerald-400 transition text-lg" title="Phát ngẫu nhiên">
                                <i class="fas fa-random"></i>
                            </button>
                            <button id="prevBtn" class="text-slate-300 hover:text-white transition text-xl" title="Bài trước">
                                <i class="fas fa-step-backward"></i>
                            </button>
                            <button id="playBtn" class="w-14 h-14 bg-gradient-to-r from-emerald-500 to-sky-500 rounded-full flex items-center justify-center text-white text-xl hover:opacity-90 transition shadow-lg shadow-emerald-500/30" title="Phát / Tạm dừng">
                                <i class="fas fa-play" id="playIcon"></i>
                            </button>
                            <button id="nextBtn" class="text-slate-300 hover:text-white transition text-xl" title="Bài tiếp">
                                <i class="fas fa-step-forward"></i>
                            </button>
                            <button id="repeatBtn" class="text-slate-500 hover:text-emerald-400 transition text-lg" title="Lặp lại">
                                <i class="fas fa-redo"></i>
                            </button>
                        </div>
                        <!-- Volume -->
                        <div class="flex items-center gap-3">
                            <button id="muteBtn" class="text-slate-400 hover:text-white transition">
                                <i class="fas fa-volume-up" id="volumeIcon"></i>
                            </button>
                            <input type="range" id="volumeSlider" min="0" max="100" value="80" class="volume-slider flex-1">
                            <span id="volumeValue" class="text-xs text-slate-500 font-terminal w-10 text-right">80%</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Playlist -->
    <section class="px-6 pb-20">
        <div class="max-w-4xl mx-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-white"><i class="fas fa-list-ul text-emerald-400 mr-2"></i>Playlist V-Pop Hot</h2>
                <span class="text-sm text-slate-500 font-terminal" id="playlistCount">10 bài hát</span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="playlistGrid">
                <!-- Rendered by JS -->
            </div>
        </div>
    </section>

    <!-- Hidden YouTube Player -->
    <div id="ytPlayer" style="position:absolute;top:-9999px;left:-9999px;width:1px;height:1px;"></div>

    <!-- Footer -->
    <footer class="border-t border-slate-800 bg-slate-950 pt-8 pb-6 text-center">
        <p class="text-slate-500 text-sm font-medium">© 2026 Nguyễn Viết Thành. System & Network Engineer.</p>
    </footer>

    <!-- YouTube IFrame API -->
    <script>
        // ===== PLAYLIST DATA =====
        const playlist = [
            { title: "Hoá Ra", artist: "Grey D", videoId: "dLRk22FWDwc" },
            { title: "Nấu Ăn Cho Em", artist: "HIEUTHUHAI", videoId: "r44BHTdT0y4" },
            { title: "Exit Sign", artist: "HIEUTHUHAI x MARZUZ", videoId: "PjSfUX9cOog" },
            { title: "Không Thể Say", artist: "HIEUTHUHAI", videoId: "FwDdJk1XPUM" },
            { title: "Ngày Đầu Tiên", artist: "Đức Phúc", videoId: "w9JFfb_0FVY" },
            { title: "Cắt Đôi Nỗi Sầu", artist: "Tăng Duy Tân ft Drum7", videoId: "dCXRV7ffXYM" },
            { title: "Đừng Làm Trái Tim Anh Đau", artist: "Sơn Tùng M-TP", videoId: "GaGjfqMYYKU" },
            { title: "Em Của Ngày Hôm Qua", artist: "Sơn Tùng M-TP", videoId: "JW9sAyMPxQA" },
            { title: "Thương Em", artist: "WinterPlay", videoId: "hBRZkxOvWP8" },
            { title: "Waiting For You", artist: "MONO", videoId: "bSH1R_jhTlQ" }
        ];

        // ===== STATE =====
        let currentIndex = -1;
        let isPlaying = false;
        let isShuffle = false;
        let repeatMode = 0; // 0: off, 1: all, 2: one
        let player = null;
        let progressInterval = null;

        // ===== DOM =====
        const songTitle = document.getElementById('songTitle');
        const songArtist = document.getElementById('songArtist');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const repeatBtn = document.getElementById('repeatBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeValue = document.getElementById('volumeValue');
        const muteBtn = document.getElementById('muteBtn');
        const volumeIcon = document.getElementById('volumeIcon');
        const playlistGrid = document.getElementById('playlistGrid');
        const mainEq = document.getElementById('mainEq');
        const navEq = document.getElementById('navEq');

        // ===== RENDER PLAYLIST =====
        function renderPlaylist() {
            playlistGrid.innerHTML = playlist.map((song, i) => `
                <div class="song-card glass-card rounded-xl p-4 flex items-center gap-4 cursor-pointer group" data-index="${i}" style="transform:none;" onclick="playSong(${i})">
                    <div class="w-10 h-10 bg-slate-800 rounded-lg flex items-center justify-center text-slate-400 group-hover:bg-emerald-500 group-hover:text-white transition shrink-0">
                        <span class="song-index font-terminal text-sm">${String(i+1).padStart(2,'0')}</span>
                        <div class="song-playing-icon hidden items-center gap-[2px]">
                            <div class="w-[3px] h-3 bg-white rounded-full animate-pulse"></div>
                            <div class="w-[3px] h-4 bg-white rounded-full animate-pulse" style="animation-delay:.15s"></div>
                            <div class="w-[3px] h-2 bg-white rounded-full animate-pulse" style="animation-delay:.3s"></div>
                        </div>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-white font-semibold truncate text-sm">${song.title}</p>
                        <p class="text-slate-500 text-xs truncate">${song.artist}</p>
                    </div>
                    <button class="text-slate-600 group-hover:text-emerald-400 transition text-lg shrink-0">
                        <i class="fas fa-play"></i>
                    </button>
                </div>
            `).join('');
        }
        renderPlaylist();

        // ===== YOUTUBE API =====
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('ytPlayer', {
                height: '1',
                width: '1',
                playerVars: { autoplay: 0, controls: 0, disablekb: 1, fs: 0, modestbranding: 1 },
                events: {
                    'onReady': () => { player.setVolume(80); },
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                handleSongEnd();
            } else if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                updatePlayButton();
                startProgressTracking();
            } else if (event.data === YT.PlayerState.PAUSED) {
                isPlaying = false;
                updatePlayButton();
                stopProgressTracking();
            }
        }

        // ===== PLAY SONG =====
        function playSong(index) {
            if (index < 0 || index >= playlist.length) return;
            currentIndex = index;
            const song = playlist[currentIndex];

            songTitle.textContent = song.title;
            songArtist.textContent = song.artist;

            // Load album thumbnail from YouTube
            const albumImg = document.getElementById('albumImg');
            const albumIcon = document.getElementById('albumIcon');
            albumImg.src = `https://img.youtube.com/vi/${song.videoId}/hqdefault.jpg`;
            albumImg.classList.remove('hidden');
            albumIcon.classList.add('hidden');

            // Load and play
            if (player && player.loadVideoById) {
                player.loadVideoById(song.videoId);
            }

            isPlaying = true;
            updatePlayButton();
            updateActiveCard();
        }

        // ===== CONTROLS =====
        playBtn.addEventListener('click', () => {
            if (currentIndex === -1) { playSong(0); return; }
            if (isPlaying) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentIndex <= 0) playSong(playlist.length - 1);
            else playSong(currentIndex - 1);
        });

        nextBtn.addEventListener('click', () => { playNext(); });

        function playNext() {
            if (isShuffle) {
                let rand;
                do { rand = Math.floor(Math.random() * playlist.length); } while (rand === currentIndex && playlist.length > 1);
                playSong(rand);
            } else {
                playSong((currentIndex + 1) % playlist.length);
            }
        }

        function handleSongEnd() {
            if (repeatMode === 2) { playSong(currentIndex); }
            else if (repeatMode === 1 || currentIndex < playlist.length - 1) { playNext(); }
            else { isPlaying = false; updatePlayButton(); }
        }

        shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('text-emerald-400', isShuffle);
            shuffleBtn.classList.toggle('text-slate-500', !isShuffle);
        });

        repeatBtn.addEventListener('click', () => {
            repeatMode = (repeatMode + 1) % 3;
            if (repeatMode === 0) {
                repeatBtn.classList.remove('text-emerald-400');
                repeatBtn.classList.add('text-slate-500');
                repeatBtn.innerHTML = '<i class="fas fa-redo"></i>';
            } else if (repeatMode === 1) {
                repeatBtn.classList.add('text-emerald-400');
                repeatBtn.classList.remove('text-slate-500');
                repeatBtn.innerHTML = '<i class="fas fa-redo"></i>';
            } else {
                repeatBtn.innerHTML = '<i class="fas fa-redo"></i><span class="text-[10px] ml-0.5">1</span>';
            }
        });

        // ===== PROGRESS =====
        function startProgressTracking() {
            stopProgressTracking();
            progressInterval = setInterval(updateProgress, 500);
        }
        function stopProgressTracking() {
            if (progressInterval) { clearInterval(progressInterval); progressInterval = null; }
        }
        function updateProgress() {
            if (!player || !player.getCurrentTime) return;
            const current = player.getCurrentTime();
            const duration = player.getDuration();
            if (duration > 0) {
                progressBar.style.width = (current / duration * 100) + '%';
                currentTimeEl.textContent = formatTime(current);
                totalTimeEl.textContent = formatTime(duration);
            }
        }
        function formatTime(s) {
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return m + ':' + String(sec).padStart(2, '0');
        }

        progressContainer.addEventListener('click', (e) => {
            if (!player || !player.getDuration) return;
            const rect = progressContainer.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            player.seekTo(pct * player.getDuration(), true);
        });

        // ===== VOLUME =====
        volumeSlider.addEventListener('input', () => {
            const vol = parseInt(volumeSlider.value);
            if (player && player.setVolume) player.setVolume(vol);
            volumeValue.textContent = vol + '%';
            updateVolumeIcon(vol);
        });
        muteBtn.addEventListener('click', () => {
            if (!player) return;
            if (player.isMuted()) {
                player.unMute();
                volumeSlider.value = player.getVolume();
            } else {
                player.mute();
                volumeSlider.value = 0;
            }
            volumeValue.textContent = volumeSlider.value + '%';
            updateVolumeIcon(parseInt(volumeSlider.value));
        });
        function updateVolumeIcon(vol) {
            if (vol === 0) volumeIcon.className = 'fas fa-volume-mute';
            else if (vol < 50) volumeIcon.className = 'fas fa-volume-down';
            else volumeIcon.className = 'fas fa-volume-up';
        }

        // ===== UI UPDATES =====
        function updatePlayButton() {
            playIcon.className = isPlaying ? 'fas fa-pause' : 'fas fa-play';
            // Equalizer animation
            if (isPlaying) {
                mainEq.classList.add('eq-playing');
                navEq.classList.add('eq-playing');
            } else {
                mainEq.classList.remove('eq-playing');
                navEq.classList.remove('eq-playing');
            }
        }

        function updateActiveCard() {
            document.querySelectorAll('.song-card').forEach((card, i) => {
                card.classList.toggle('active', i === currentIndex);
            });
        }
    </script>
</body>
</html>
